title: Scientific Figure Recipe Schema
description: >
  图表 YAML 配方结构。Recipe 描述数据、视觉编码、输出、可访问性意图、上游研究引用与不确定性语义；
  Schema 通过只证明结构，不证明数据、统计结论或出版合规。
type: object
required: [id, type, data, aesthetics, output]
additionalProperties: true
properties:
  id:
    type: string
    minLength: 1
    description: "配方稳定标识"
  name:
    type: string
    description: "人类可读名称"
  type:
    type: string
    enum: [line-chart, bar-chart, scatter-plot, heatmap, boxplot, histogram]
    description: "当前统一 CLI 支持的图表类型"
  data:
    type: object
    description: "图表内嵌数据；结构由具体 chart type/backend 解释"
  aesthetics:
    type: object
    description: "视觉编码与渲染参数"
    properties:
      title: {type: string}
      x_label: {type: string}
      y_label: {type: string}
      palette:
        type: array
        items: {type: string}
      font_size:
        type: number
        exclusiveMinimum: 0
      figsize:
        type: array
        items: {type: number, exclusiveMinimum: 0}
        minItems: 2
        maxItems: 2
      dpi:
        type: integer
        minimum: 72
      line_width:
        type: number
        exclusiveMinimum: 0
      axes_linewidth:
        type: number
        exclusiveMinimum: 0
      semantic_palette:
        type: boolean
        description: "启用项目约定的 series-label -> color 映射；不是普适心理学语义"
      background:
        type: string
        description: "画布背景色"
      text_color:
        type: string
        description: "显式文字颜色；运行时规则可检查与背景的项目对比阈值"
      adjacency_check:
        type: boolean
        description: "启用项目额外的全分类色对 3:1 检查；比 WCAG 实际相邻对象作用域更严格"
      palette_name:
        type: string
        description: "core/palettes.py 中注册的 categorical palette 名称"
      cmap:
        type: string
        description: "热力图等连续色阶名称，由后端解析"
      bins:
        type: integer
        minimum: 1
        description: "直方图 bins"

  accessibility:
    type: object
    description: >
      项目级可访问性意图。支持 WCAG 2.2 相关设计原则，但不构成整份论文/PDF/网页的 WCAG conformance 声明。
    properties:
      alt_text:
        type: string
        minLength: 1
        description: "短文本替代；面向 SC 1.1.1 支持"
      long_description:
        type: string
        minLength: 1
        description: "可选复杂图长描述"
      require_alt_text:
        type: boolean
      redundant_encoding:
        type: string
        enum: [off, auto, required]
        default: off
        description: "required 时颜色不得成为多系列区分的唯一视觉线索，面向 SC 1.4.1"
      series_styles:
        type: object
        additionalProperties:
          type: object
          properties:
            marker: {type: string}
            line_style: {type: string}
            hatch: {type: string}
      adjacent_pairs:
        type: array
        description: >
          实际需要通过边界辨认的图形系列标签对；仅这些声明式相邻对象映射到 SC 1.4.11 的边界对比语义。
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: string}

  research_context:
    type: object
    description: >
      可选上游研究证据引用。CLI 只记录引用/本地 hash，不自动验证上游 claim 的科学真实性。
    properties:
      evidence_envelope_ref:
        type: string
        minLength: 1
        description: "例如 epistemic-pipeline/evidence-envelope@1 的本地路径或 URI"
      provenance_ref:
        type: string
        minLength: 1
      data_artifact_ref:
        type: string
        minLength: 1
      claim_refs:
        type: array
        items: {type: string, minLength: 1}

  uncertainty:
    type: object
    required: [kind, semantics]
    description: >
      图中不确定性的统计/工程含义。上下界不得仅因存在就被称作 confidence interval。
    properties:
      kind:
        type: string
        enum:
          - standard-error
          - standard-deviation
          - confidence-interval
          - credible-interval
          - min-max-range
          - quantile-interval
          - bootstrap-interval
          - heuristic-bound
          - not-applicable
      level:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: "例如 0.95；仅在对应统计方法确实定义 coverage/credible level 时有意义"
      semantics:
        type: string
        minLength: 1
        description: "说明区间如何计算、代表什么以及不代表什么"
      source_ref:
        type: string
        minLength: 1
        description: "可选统计计算、上游产物或数据源引用"

  output:
    type: object
    required: [dir, filename]
    properties:
      dir:
        type: string
        minLength: 1
      filename:
        type: string
        minLength: 1
      format:
        type: string
        enum: [png, svg, pdf, html]
        default: png

  notes:
    type: string
    description: "人类注释；不参与运行时语义判断"
