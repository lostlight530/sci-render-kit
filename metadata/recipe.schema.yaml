title: Recipe Schema
description: "图表配方的 YAML Schema 定义 | Chart recipe YAML schema definition"
type: object
required:
- id
- type
- data
- aesthetics
- output
properties:
  id:
    type: string
    description: "配方唯一标识"
  name:
    type: string
    description: "人类可读名称"
  type:
    type: string
    enum:
    - line-chart
    - bar-chart
    - scatter-plot
    - heatmap
    - boxplot
    - histogram
    description: "图表类型"
  data:
    type: object
    description: "图表数据（类型相关）"
  aesthetics:
    type: object
    description: "美学参数"
    properties:
      title:
        type: string
      x_label:
        type: string
      y_label:
        type: string
      palette:
        type: array
        items:
          type: string
      font_size:
        type: integer
        minimum: 5
      figsize:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      dpi:
        type: integer
        minimum: 72
      line_width:
        type: number
        minimum: 0.1
      semantic_palette:
        type: boolean
        description: "启用语义色彩编码：按系列名的语义标签自动生成色板"
      background:
        type: string
        description: "画布背景色（hex），用于 palette-contrast 对比度门禁"
      text_color:
        type: string
        description: "文字颜色（hex），声明后由 P1 text-contrast 门禁校验与背景对比度 ≥ 4.5（WCAG SC 1.4.3）"
      adjacency_check:
        type: boolean
        description: "启用分类色板两两相邻对比度检查（P1 palette-adjacency，WCAG SC 1.4.11，≥ 3.0）"
      palette_name:
        type: string
        description: "注册色板名称（core/palettes.py，如 okabe-ito / petroff10）；P1 palette-name 门禁校验"
      cmap:
        type: string
        description: "热力图色阶名称"
      bins:
        type: integer
        minimum: 1
        description: "直方图的柱数"
  output:
    type: object
    required:
    - dir
    - filename
    properties:
      dir:
        type: string
        description: "输出目录"
      filename:
        type: string
        description: "输出文件名"
      format:
        type: string
        enum:
        - png
        - svg
        - pdf
        - eps
        - html
        default: png
        description: "输出格式"
  notes:
    type: string
    description: "人类注释"
