title: "Quality Gates"
description: "渲染前后的质量检查门 | Pre/post-render quality inspection gates"

gates:
  - id: P0-recipe-valid
    name: "配方静态验证"
    level: P0
    description: "渲染前必须通过的静态检查"
    checks:
      - id: schema-compliance
        name: "Schema 合规"
        rule: "配方必须符合 recipe.schema.yaml 定义的字段要求"
      - id: required-fields
        name: "必需字段"
        rule: "必须包含 id, type, data, aesthetics, output"
      - id: data-type
        name: "数据类型检查"
        rule: "data 必须是字典或列表"
      - id: output-config
        name: "输出配置"
        rule: "output 必须包含 dir 和 filename"

  - id: P1-aesthetics-check
    name: "美学规范检查"
    level: P1
    description: "渲染前的美学参数验证"
    checks:
      - id: color-count
        name: "颜色数量"
        rule: "palette 中颜色数 ≤ 8"
      - id: font-size
        name: "字号合规"
        rule: "font_size ≥ 5 (Nature) 或 ≥ 6 (Science)"
      - id: forbidden-pairs
        name: "禁止配色"
        rule: "不包含红绿并置组合"
      - id: palette-contrast
        name: "色板对比度"
        rule: "声明 background 或启用 semantic_palette 时，色板颜色与背景的 WCAG 对比度 ≥ 3.0"
      - id: text-contrast
        name: "文字对比度"
        rule: "声明 text_color 时，文字与背景（未声明则按 #FFFFFF）的 WCAG 对比度 ≥ 4.5（SC 1.4.3）"
      - id: palette-adjacency
        name: "相邻色对"
        rule: "声明 adjacency_check: true 时，启用项目的严格分类色板两两对比度策略（≥ 3.0）并报告失败色对；该策略比 WCAG 2.2 SC 1.4.11 对实际相邻、且为理解所必需的图形对象要求更严格，不等同于 WCAG 的一般性两两要求"
      - id: cvd-contrast
        name: "色盲模拟对比度"
        rule: "声明 background 或启用 semantic_palette 时，色板颜色在 Machado 2009 三色盲模拟下与背景对比度 ≥ 3.0"
      - id: palette-name
        name: "注册色板"
        rule: "声明 palette_name 时必须命中 core/palettes.py 注册表；系列图仅接受 categorical 类型色板"
      - id: no-3d
        name: "3D 禁用"
        rule: "type 不为 3d-*"

  - id: P2-output-integrity
    name: "输出完整性检查"
    level: P2
    description: "渲染后的输出验证"
    checks:
      - id: file-exists
        name: "文件存在"
        rule: "输出文件已成功生成"
      - id: non-empty
        name: "非空文件"
        rule: "文件大小 > 0"
      - id: format-match
        name: "格式匹配"
        rule: "文件扩展名与 output.format 一致"
      - id: manifest-exists
        name: "元数据存在"
        rule: "同名的 .manifest.json 必须存在"
      - id: prov-exists
        name: "溯源旁车存在"
        rule: "matplotlib 后端渲染必须产出同名 .prov.json（FAIR R1.2 溯源旁车；R/JS 侧为可选跟进）"

  - id: P3-journal-compliance
    name: "期刊规范对齐"
    level: P3
    description: "针对目标期刊的专项检查"
    checks:
      - id: vector-format
        name: "矢量格式"
        rule: "对于 Nature/Science/Cell，输出必须是 PDF 或 EPS"
      - id: dpi-check
        name: "DPI 达标"
        rule: "合并后的 DPI 不得低于 profile 声明的期刊最低 DPI（profile aesthetics.dpi）"
      - id: size-check
        name: "尺寸合规"
        rule: "figsize 为正值二元组；profile 声明 max_width_in/max_height_in 时图宽/图高不得超过对应版面上限"
