name: sci-render-kit
purpose: 声明式、可溯源、可访问性可审计的学术可视化工具包 | Declarative scientific visualization with provenance and auditable accessibility contracts

principles:
  - 声明优先: 图表数据、出版约束与可访问性意图由 YAML 声明
  - 后端能力诚实: 同一配方可切换后端，但不伪装尚未实现的 accessibility/backend 能力
  - 质量前置: P0 schema 与 P1 美学/可访问性门在渲染前执行
  - 输出可验证: P2 检查图件、manifest、provenance 与 accessibility sidecar
  - 出版规范显式: P3 profile 约束 DPI、尺寸与矢量格式
  - 颜色不是唯一通道: required redundant encoding 使用 marker / line_style / hatch 提供非颜色视觉线索
  - 标准边界诚实: WCAG 条款用于设计与门禁映射，不声明整篇论文/PDF/网站自动达到 WCAG conformance
  - 科学边界: gate/profile/provenance 只证明实现的谓词与记录，不证明统计结论、因果或独立复现

research_contract:
  file: RESEARCH_CONTRACT.md
  status: active
  local_reproducibility_levels: [R0, R1, R2, R3]
  note: local project terminology; R3 requires a separate rerun and declared comparison criterion
  preferred_upstream_fields:
    - artifact_id
    - source_refs
    - content_or_data_sha256
    - run_or_analysis_ref
    - uncertainty_semantics
    - provenance_ref
    - validation_status
  preferred_figure_outputs:
    - figure_id
    - recipe_sha256
    - input_data_sha256
    - profile_id
    - backend_id
    - output_sha256
    - manifest_ref
    - provenance_ref
    - quality_gate_status

interoperability_targets:
  ro_crate:
    status: proposed
    version: "1.3"
    published: "2026-06-22"
    note: current manifest/prov/a11y sidecars are not RO-Crates; exporter + validator + tests required

backends:
  - name: matplotlib
    language: python
    adapter: backends/matplotlib_adapter.py
    base_adapter: backends/matplotlib_base.py
    capabilities: [png, svg, pdf]
    accessibility: [text-alternative-metadata, text-alternative-sidecar, redundant-series-style]
    default: true
  - name: ggplot2
    language: r
    adapter: backends/ggplot2_adapter.R
    capabilities: [png, svg, pdf]
    accessibility: [text-alternative-sidecar]
    redundant_series_style: not_integrated
  - name: observable
    language: javascript
    adapter: backends/observable_adapter.js
    capabilities: [html]
    accessibility: [text-alternative-sidecar]
    redundant_series_style: not_integrated

profiles: [nature, science, cell, ieee, presentation]

recipes:
  types: [line-chart, bar-chart, scatter-plot, heatmap, boxplot, histogram]
  schema: metadata/recipe.schema.yaml
  accessibility_example: recipes/accessible-line-chart.yaml

accessibility:
  profile: sci-render-kit/a11y@1
  module: core/accessibility.py
  sidecar: <output>.a11y.json
  fields: [alt_text, long_description, require_alt_text, redundant_encoding, series_styles, adjacent_pairs]
  wcag_2_2_design_support:
    - "1.1.1: text alternative contract"
    - "1.4.1: non-color redundant series cues"
    - "1.4.11: contrast for explicitly declared adjacent graphical series"
  project_strict_policy:
    aesthetics.adjacency_check: "all unique palette pairs >= 3.0; stricter than WCAG actual-adjacency scope"
  conformance_claim: false

quality:
  gates: quality/gates.yaml
  levels: [P0, P1, P2, P3]

metadata:
  reproducibility:
    required: true
    schema: metadata/reproducibility.schema.yaml
    sidecar: <output>.manifest.json
  provenance:
    matplotlib: implemented
    sidecar: <output>.prov.json
    other_backends: optional_follow_up
  accessibility:
    when_declared: required
    sidecar: <output>.a11y.json

research_software:
  citation: CITATION.cff
  cff_version: "1.2.0"

verification:
  local_contract: make test
  github_actions: .github/workflows/ci.yml
  python: "3.12"
  ci_python_dependencies: [pyyaml, jsonschema, matplotlib, numpy, pillow]
  node_and_r_runtime: optional_and_not_required_for_core_ci

experimental_modules:
  - projection
  - time_crystal
  - uncertainty_legend
  - observer_dashboard
  - superposition
